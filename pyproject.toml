[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "movilidad-core"
version = "0.1.0"
description = "Backend de datos de movilidad de Aldea Pucela"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "SQLAlchemy>=2.0,<3",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.8,<1",
]

[project.scripts]
movilidad-api = "movilidad.api.main:run"
movilidad-collector = "movilidad.collector.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/movilidad"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
