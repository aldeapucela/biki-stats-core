name: CI y publicación

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: movilidad-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -e '.[dev]'

      - name: Ejecutar validación bloqueante
        run: ./scripts/validate.sh

  calculate-version:
    name: Calcular versión
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Descargar historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calcular siguiente versión
        id: version
        run: |
          version="$(python scripts/release_version.py)"
          if [ -n "$version" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Siguiente versión: $version"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No hay commits publicables; no se crea release."
          fi

      - name: Crear y publicar tag
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

  publish-docker:
    name: Publicar Docker
    if: needs.calculate-version.outputs.release == 'true'
    needs: calculate-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar commit publicado
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            credondoc/biki-stats-core:${{ needs.calculate-version.outputs.version }}
            credondoc/biki-stats-core:latest
          build-args: |
            APP_VERSION=${{ needs.calculate-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
