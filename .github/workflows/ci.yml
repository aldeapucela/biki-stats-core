name: CI y versionado

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: movilidad-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -e '.[dev]'

      - name: Ejecutar validación bloqueante
        env:
          PYTHON_BIN: python
          ALEMBIC_BIN: alembic
          RUFF_BIN: ruff
        run: ./scripts/validate.sh

  calculate-version:
    name: Calcular versión
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Descargar historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calcular siguiente versión
        id: version
        run: |
          version="$(python scripts/release_version.py)"
          if [ -n "$version" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Siguiente versión: $version"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No hay commits publicables; no se crea release."
          fi

      - name: Crear y publicar tag
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
