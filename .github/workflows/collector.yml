name: Captura GBFS

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: movilidad-collector
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Solicitar captura remota
        env:
          COLLECTOR_API_URL: https://api.aldeapucela.org/biki
          MOVILIDAD_COLLECTOR_TOKEN: ${{ secrets.MOVILIDAD_COLLECTOR_TOKEN }}
        run: >-
          curl --fail-with-body --silent --show-error --max-time 180
          --request POST
          --header "Authorization: Bearer ${MOVILIDAD_COLLECTOR_TOKEN}"
          "${COLLECTOR_API_URL}/api/v1/ops/collector/run"
