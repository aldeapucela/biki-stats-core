services:
  api:
    image: biki-stats-core:${APP_GIT_SHA:-local}
    build:
      context: .
      args:
        - PORT=${PORT:-8004}
        - APP_GIT_SHA=${APP_GIT_SHA:-unknown}
        - APP_VERSION=${APP_VERSION:-unknown}
        - APP_UID=${DOCKER_UID:-1000}
        - APP_GID=${DOCKER_GID:-1000}
    command: ["uvicorn", "movilidad.api.main:app", "--host", "0.0.0.0", "--port", "${PORT:-8004}"]
    environment:
      BIKI_ENV: ${BIKI_ENV:-production}
      BIKI_DATABASE_PATH: /data/movilidad.sqlite3
      BIKI_COLLECTOR_TOKEN: ${BIKI_COLLECTOR_TOKEN:-}
      BIKI_CORS_ORIGINS: ${BIKI_CORS_ORIGINS:-https://biki.aldeapucela.org,http://localhost:5173,http://localhost:5174}
      BIKI_GBFS_URL: ${BIKI_GBFS_URL:-https://valladolid.publicbikesystem.net/customer/gbfs/v3.0/gbfs.json}
      BIKI_CAPTURE_INTERVAL_SECONDS: ${BIKI_CAPTURE_INTERVAL_SECONDS:-300}
      BIKI_HTTP_TIMEOUT_SECONDS: ${BIKI_HTTP_TIMEOUT_SECONDS:-20}
      BIKI_LOG_LEVEL: ${BIKI_LOG_LEVEL:-INFO}
      BIKI_HISTORY_IMPORT_ON_STARTUP: ${BIKI_HISTORY_IMPORT_ON_STARTUP:-true}
      BIKI_HISTORY_SOURCE_REPOSITORY: ${BIKI_HISTORY_SOURCE_REPOSITORY:-serherval/flujosbiki}
      BIKI_HISTORY_SOURCE_REF: ${BIKI_HISTORY_SOURCE_REF:-main}
      BIKI_HISTORY_IMPORT_RETRY_SECONDS: ${BIKI_HISTORY_IMPORT_RETRY_SECONDS:-300}
    ports:
      - "127.0.0.1:${PORT:-8004}:${PORT:-8004}"
    volumes:
      - movilidad-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${PORT:-8004}/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  collector:
    image: biki-stats-core:${APP_GIT_SHA:-local}
    pull_policy: never
    command: ["movilidad-collector", "--loop"]
    environment:
      BIKI_ENV: ${BIKI_ENV:-production}
      BIKI_DATABASE_PATH: /data/movilidad.sqlite3
      BIKI_GBFS_URL: ${BIKI_GBFS_URL:-https://valladolid.publicbikesystem.net/customer/gbfs/v3.0/gbfs.json}
      BIKI_CAPTURE_INTERVAL_SECONDS: ${BIKI_CAPTURE_INTERVAL_SECONDS:-300}
      BIKI_HTTP_TIMEOUT_SECONDS: ${BIKI_HTTP_TIMEOUT_SECONDS:-20}
      BIKI_LOG_LEVEL: ${BIKI_LOG_LEVEL:-INFO}
      BIKI_HISTORY_IMPORT_ON_STARTUP: "false"
    volumes:
      - movilidad-data:/data
    stop_grace_period: 120s
    restart: unless-stopped

volumes:
  movilidad-data:
